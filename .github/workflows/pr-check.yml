name: PR Check

# The merge-check pre-pass, through the bridge.
#
# A stub for a public repo: nothing here runs a lane. It applies the lanes'
# cheap event guards and starts one entry workflow in the private
# beaverbuilder/beaver-builder-dev-workspace, sending only the repo, the lane,
# numbers, the event's action and sender, and a comment id. It never checks out
# code, never uses an action, and passes no free text. LANE_DISPATCH_TOKEN is a
# secret of the `lane-bridge` environment, which only the default branch may
# use; changing this file needs another maintainer's approval. The job is keyed
# `bridge`, never the name of a required check.

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, assigned]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  bridge:
    # The fork and comment-author prefilters, then the pre-pass's own guard,
    # verbatim (its review arm stays, inert).
    if: >-
      (github.event_name != 'pull_request_target'
        || github.event.pull_request.head.repo.full_name == github.repository)
      && (github.event_name != 'issue_comment'
        || contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
      && (
        (
          (github.event_name == 'pull_request_target'
            && contains(fromJSON('["opened","reopened","ready_for_review","synchronize","assigned"]'), github.event.action)
            && github.event.pull_request.state == 'open'
            && github.event.pull_request.draft == false
            && contains(github.event.pull_request.assignees.*.login, 'beaverbuilderbot')
            && (github.event.action != 'assigned'
                || github.event.assignee.login == 'beaverbuilderbot')
            && (github.event.action != 'synchronize'
                || github.event.sender.login == 'beaverbuilderbot'))
          || (github.event_name == 'issue_comment'
            && github.event.action == 'created'
            && github.event.issue.pull_request != null
            && github.event.issue.state == 'open'
            && contains(github.event.issue.assignees.*.login, 'beaverbuilderbot')
            && github.event.comment.user.type != 'Bot'
            && !contains(github.event.comment.body, 'bb-merge-check')
            && !contains(github.event.comment.body, 'bb-test-evidence')
            && !contains(github.event.comment.body, 'beaver-dev-review')
            && !contains(github.event.comment.body, 'bb-beaver-dev')
            && !contains(github.event.comment.body, '## Code Review:'))
          || (github.event_name == 'pull_request_review'
            && github.event.action == 'submitted'
            && github.event.pull_request.state == 'open'
            && github.event.pull_request.draft == false
            && contains(github.event.pull_request.assignees.*.login, 'beaverbuilderbot')
            && github.event.review.user.type != 'Bot'
            && github.event.review.user.login != 'beaverbuilderbot'
            && contains(github.event.pull_request.labels.*.name, 'merge: needs decision'))
        )
        || (
          github.event_name == 'pull_request_target'
            && github.event.action == 'synchronize'
            && github.event.pull_request.state == 'open'
            && github.event.pull_request.draft == false
            && contains(github.event.pull_request.assignees.*.login, 'beaverbuilderbot')
            && github.event.sender.login != 'beaverbuilderbot'
        )
      )
    runs-on: ubuntu-latest
    environment: lane-bridge
    timeout-minutes: 5
    permissions: {}
    steps:
      # Every value reaches the shell through env. Only the token's expiry
      # line is printed; a non-2xx answer fails the step.
      - name: Dispatch
        env:
          GH_TOKEN: ${{ secrets.LANE_DISPATCH_TOKEN }}
          ENTRY: bridge-check.yml
          REPO: ${{ github.repository }}
          LANE: check
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          ISSUE: ''
          STAGE: ''
          ACTION: ${{ github.event.action || 'dispatch' }}
          SENDER: ${{ github.event.sender.login }}
          COMMENT: ${{ github.event.comment.id }}
          FLAGS: ''
        run: |
          WORKFLOW="repos/beaverbuilder/beaver-builder-dev-workspace/actions/workflows/$ENTRY"
          gh api -i --method POST "$WORKFLOW/dispatches" -f ref=main \
            -f "inputs[repo]=$REPO" -f "inputs[lane]=$LANE" -f "inputs[pr]=$PR" -f "inputs[issue]=$ISSUE" \
            -f "inputs[stage]=$STAGE" -f "inputs[action]=$ACTION" -f "inputs[sender]=$SENDER" \
            -f "inputs[comment]=$COMMENT" -f "inputs[flags]=$FLAGS" > "$RUNNER_TEMP/dispatch.txt"
          EXPIRES="$(tr -d '\r' < "$RUNNER_TEMP/dispatch.txt" \
            | grep -i '^github-authentication-token-expiration:' | head -1 | cut -d' ' -f2- || true)"
          echo "bridge-token-expires: ${EXPIRES:-none}"
# Proof: a change to this file needs another maintainer to approve it.
